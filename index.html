<style>
/* ==========================================================================
   Joel Transformation — Design System v3 "Deep Water"
   ==========================================================================
   An 84-day cut, dressed like an editorial rather than an admin panel.

   Ground:  a single vertical gradient — near-black navy at the crown, through
            true blue, into a pale sky, landing on the off-white the content
            sits on. It runs behind every page header, so the identity is the
            page itself rather than a stripe of brand colour.
   Ink:     #0b1533 navy — the nav bar, the primary button, the feature card.
   Data:    three blues at spaced lightness (navy / azure / sky). Deliberately
            monochrome: the gradient is already doing the talking. Rose is
            reserved for missed days and destructive actions, and appears
            nowhere else.

   Type:    Instrument Serif — roman for headings, italic for the one word in
            each headline that carries the emphasis. Instrument Sans for every
            label, control, figure and paragraph. Same foundry, so the pairing
            shares proportions while contrasting sharply in voice.

   Layout:  a dark sticky top bar over a gradient band that holds the page
            header and its tab strip; content flows beneath on the pale ground
            in a 12-column grid. No side rail anywhere — on mobile the same
            five sections sit in a floating bottom bar.
   ========================================================================== */

:root {
  /* ---- The gradient, as discrete stops so bands and washes stay in sync -- */
  --grad-0: #04081a;
  --grad-1: #0d2149;
  --grad-2: #2c5b9e;
  --grad-3: #8bb4e0;

  /* ---- Light palette ---- */
  --page: #eef2f8;
  --surface: #ffffff;
  --surface-2: #e9eff7;
  --surface-3: #dde6f1;
  --border: #d7e1ee;
  --border-soft: #e5ebf4;

  --ink: #0b1533;
  --ink-2: #16244c;
  --on-ink: #f2f6fb;
  --on-ink-muted: #93a4c4;

  --text: #0b1533;
  --text-muted: #56688a;
  --text-faint: #8c9cb5;

  --accent: #1f5fd0;
  --accent-soft: #dde8fb;

  --rose: #b23a54;
  --rose-soft: #fadfe4;

  /* Chart series — three blues at spaced lightness, plus line-only variants */
  --series-a: #0b1533;
  --series-b: #3b82f6;
  --series-c: #a9cbef;
  --series-line-a: #0b1533;
  --series-line-b: #3b82f6;
  --series-line-c: #7fa9d8;

  /* Legacy aliases still referenced by a few call sites */
  --red: #b23a54;
  --amber: #8a6d3b;

  --shadow-sm: 0 1px 2px rgba(11, 21, 51, 0.05);
  --shadow-md: 0 8px 26px rgba(11, 21, 51, 0.09);
  --shadow-lg: 0 26px 60px rgba(4, 8, 26, 0.32);

  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 22px;
  --radius-pill: 999px;

  --font-sans: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;

  --nav-h: 66px;

  color-scheme: light;
}

/* System dark — only when the viewer hasn't explicitly chosen light. */
:root[data-theme="dark"],
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --grad-0: #02040e;
    --grad-1: #081735;
    --grad-2: #17325e;
    --grad-3: #1d2c44;

    --page: #0a0f1c;
    --surface: #121a2c;
    --surface-2: #1a2438;
    --surface-3: #223047;
    --border: #263349;
    --border-soft: #1d2739;

    --ink: #060b1a;
    --ink-2: #101a30;
    --on-ink: #eaf1fa;
    --on-ink-muted: #8496b5;

    --text: #eaf1fa;
    --text-muted: #9aabc6;
    --text-faint: #64748f;

    --accent: #5c9bff;
    --accent-soft: #16263f;

    --rose: #e0808f;
    --rose-soft: #3b1e26;

    --series-a: #dbe7f6;
    --series-b: #5c9bff;
    --series-c: #2f4f7d;
    --series-line-a: #dbe7f6;
    --series-line-b: #5c9bff;
    --series-line-c: #6f92c4;

    --amber: #c69a5e;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-md: 0 8px 26px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 26px 60px rgba(0, 0, 0, 0.7);

    color-scheme: dark;
  }
}

/* Explicit dark choice — beats a light OS. */
:root[data-theme="dark"] {
  --grad-0: #02040e;
  --grad-1: #081735;
  --grad-2: #17325e;
  --grad-3: #1d2c44;

  --page: #0a0f1c;
  --surface: #121a2c;
  --surface-2: #1a2438;
  --surface-3: #223047;
  --border: #263349;
  --border-soft: #1d2739;

  --ink: #060b1a;
  --ink-2: #101a30;
  --on-ink: #eaf1fa;
  --on-ink-muted: #8496b5;

  --text: #eaf1fa;
  --text-muted: #9aabc6;
  --text-faint: #64748f;

  --accent: #5c9bff;
  --accent-soft: #16263f;

  --rose: #e0808f;
  --rose-soft: #3b1e26;

  --series-a: #dbe7f6;
  --series-b: #5c9bff;
  --series-c: #2f4f7d;
  --series-line-a: #dbe7f6;
  --series-line-b: #5c9bff;
  --series-line-c: #6f92c4;

  --amber: #c69a5e;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 8px 26px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 26px 60px rgba(0, 0, 0, 0.7);

  color-scheme: dark;
}

/* ---- Base ---------------------------------------------------------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 400;
  margin: 0;
  letter-spacing: -0.015em;
  line-height: 1.04;
  text-wrap: balance;
}
h1 em, h2 em { font-style: italic; }
p { margin: 0; }
button { font-family: inherit; }
a { color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
::selection { background: var(--accent); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

.figure, .stat-row .value, .meal-macros b, .week-chip .pct,
.tile-val, .bn-item, .set-row input, .cal-day { font-variant-numeric: tabular-nums; }

/* ---- Shell --------------------------------------------------------- */
#app { min-height: 100%; background: var(--page); }
.app-shell { display: block; width: 100%; }

/* ---- Top bar ------------------------------------------------------- */
.topnav {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--nav-h);
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 16px;
  background: rgba(4, 8, 26, 0.82);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  color: #fff;
}
@media (min-width: 900px) { .topnav { padding: 0 30px; gap: 34px; } }

/* Wordmark */
.brand {
  display: flex;
  align-items: baseline;
  gap: 9px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  color: #fff;
  flex-shrink: 0;
  font-family: inherit;
}
.brand-name {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 25px;
  line-height: 1;
  letter-spacing: -0.01em;
}
.brand-rule { width: 15px; height: 1px; background: rgba(255, 255, 255, 0.45); align-self: center; flex-shrink: 0; }
.brand-sub {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.72);
  white-space: nowrap;
}
@media (max-width: 560px) { .brand-rule, .brand-sub { display: none; } }

.nav-links { display: none; align-items: center; gap: 4px; margin-left: auto; }
@media (min-width: 900px) { .nav-links { display: flex; } }
.nav-link {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.66);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 9px 14px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  font-family: inherit;
  transition: color .16s ease, background .16s ease;
  white-space: nowrap;
}
.nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.nav-link.active { color: #fff; }
.nav-link.active::after {
  content: "";
  display: block;
  height: 1.5px;
  background: #fff;
  margin: 5px auto -2px;
  width: 16px;
  border-radius: 2px;
}

.nav-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
@media (min-width: 900px) { .nav-right { margin-left: 0; } }
.nav-icon {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: #fff;
  cursor: pointer;
  flex-shrink: 0;
}
.nav-icon:hover { background: rgba(255, 255, 255, 0.18); }
.nav-cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  height: 40px;
  padding: 0 6px 0 18px;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: transform .12s ease;
}
.nav-cta:active { transform: scale(0.98); }
.nav-cta .cta-box {
  width: 28px; height: 28px;
  background: var(--ink);
  color: #fff;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
@media (max-width: 700px) { .nav-cta { padding: 0 6px 0 14px; font-size: 0; gap: 0; } .nav-cta .cta-box { margin: 0; } }

/* ---- Gradient band ------------------------------------------------- */
.band {
  background: linear-gradient(180deg,
    var(--grad-0) 0%,
    var(--grad-1) 34%,
    var(--grad-2) 66%,
    var(--grad-3) 86%,
    var(--page) 100%);
  color: #fff;
  padding: 34px 16px 30px;
}
@media (min-width: 900px) { .band { padding: 34px 30px 30px; } }
.band-inner { max-width: 1180px; margin: 0 auto; }
.band .eyebrow { color: rgba(255, 255, 255, 0.72); }
.band .eyebrow::before { background: rgba(255, 255, 255, 0.6); }
.band .sub { color: rgba(255, 255, 255, 0.74); }
.band h1 { color: #fff; }

.main-scroll {
  max-width: 1180px;
  margin: 0 auto;
  padding: 26px 16px calc(110px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 900px) { .main-scroll { padding: 30px 30px 60px; } }

/* Route change: content rises into place once, from a visible resting state. */
.page-enter { animation: rise .34s cubic-bezier(.22,.7,.3,1) both; }
@keyframes rise { from { opacity: 0.35; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---- Page header --------------------------------------------------- */
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
.topbar h1 { font-size: clamp(38px, 7vw, 66px); }
.topbar .sub { font-size: 14px; margin-top: 10px; max-width: 46ch; }
.eyebrow {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 14px;
}
.eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--text-muted); flex-shrink: 0; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

/* ---- Hero (Today) --------------------------------------------------- */
.hero { position: relative; }
.hero-grid { display: grid; gap: 22px; align-items: end; }
@media (min-width: 900px) { .hero-grid { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 40px; } }

.hero-media {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  aspect-ratio: 4 / 5;
  max-height: 330px;
  background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03));
  border: 1px solid rgba(255, 255, 255, 0.16);
  display: flex;
  align-items: center;
  justify-content: center;
}
/* On a phone the photo is a banner, not a portrait — otherwise it eats the
   whole first screen and the day's numbers fall below the fold. */
@media (max-width: 899px) { .hero-media { aspect-ratio: 16 / 9; max-height: 190px; } }
.hero-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-media .ph {
  text-align: center;
  color: rgba(255, 255, 255, 0.8);
  padding: 22px;
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
}
.hero-media .ph-title { font-family: var(--font-display); font-style: italic; font-size: 21px; margin-top: 12px; }
.hero-media .ph-sub { font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-top: 8px; }
.hero-photo-edit {
  position: absolute;
  right: 10px; bottom: 10px;
  border: none;
  background: rgba(4, 8, 26, 0.6);
  backdrop-filter: blur(8px);
  color: #fff;
  border-radius: var(--radius-pill);
  padding: 7px 13px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.hero-copy { display: flex; flex-direction: column; gap: 22px; }
.hero-quote {
  max-width: 22ch;
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(27px, 3.6vw, 42px);
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: #fff;
}
.hero-title { font-size: clamp(44px, 9vw, 88px); color: #fff; line-height: 0.95; }
.hero-stats { display: flex; gap: 30px; flex-wrap: wrap; }
.hero-stat .hs-val { font-family: var(--font-display); font-size: 34px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
.hero-stat .hs-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-top: 7px; }

/* ---- Tab strip (sits on the band) ----------------------------------- */
.pill-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
  margin-top: 26px;
}
.pill-tabs::-webkit-scrollbar { display: none; }
.pill-tabs button {
  flex: 0 0 auto;
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 9px 17px;
  border-radius: var(--radius-pill);
  font-weight: 600;
  font-size: 12.5px;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}
.pill-tabs button.active { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
/* On the band the same strip inverts to glass */
.band .pill-tabs button { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.82); }
.band .pill-tabs button:hover { background: rgba(255,255,255,0.2); }
.band .pill-tabs button.active { background: #fff; border-color: #fff; color: var(--ink); }

/* ---- Grid ---------------------------------------------------------- */
.dash { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; align-items: start; }
.c3, .c4, .c5, .c6, .c7, .c8, .c9, .c12 { grid-column: span 12; }
@media (min-width: 700px) { .c3, .c4, .c6 { grid-column: span 6; } }
@media (min-width: 1080px) {
  .c3 { grid-column: span 3; }
  .c4 { grid-column: span 4; }
  .c5 { grid-column: span 5; }
  .c6 { grid-column: span 6; }
  .c7 { grid-column: span 7; }
  .c8 { grid-column: span 8; }
  .c9 { grid-column: span 9; }
}
.stack { display: flex; flex-direction: column; gap: 16px; }
.section { margin-top: 24px; }
.section:first-child { margin-top: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* ---- Cards --------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 12px; }
.dash > .card + .card, .stack > .card + .card, .dash > .meal-card + .meal-card { margin-top: 0; }

.card.feature {
  background: linear-gradient(155deg, var(--ink-2), var(--ink));
  border-color: rgba(255, 255, 255, 0.1);
  color: var(--on-ink);
}
.card.feature .card-title { color: var(--on-ink-muted); }
.card.feature .chip-ic { background: rgba(255, 255, 255, 0.12); color: var(--on-ink); }
.card.feature .faint, .card.feature .muted, .card.feature .figure-note { color: var(--on-ink-muted); }
.card.feature .figure { color: var(--on-ink); }
.card.feature .pill-select { background: rgba(255, 255, 255, 0.12); border-color: transparent; color: var(--on-ink); }

.card-title {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--text-muted);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-title > .grow { flex: 1; }
.chip-ic {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.chip-ic.on-accent { background: var(--ink); color: var(--on-ink); }

/* ---- Figures ------------------------------------------------------- */
.figure {
  font-family: var(--font-sans);
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1;
  font-size: 32px;
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
/* Hero-scale figures switch to the serif — the one place digits get to be pretty */
.figure.lg { font-family: var(--font-display); font-weight: 400; font-size: clamp(42px, 7vw, 58px); letter-spacing: -0.01em; }
.figure.sm { font-size: 22px; }
.figure .unit { font-family: var(--font-sans); font-size: 12.5px; font-weight: 500; color: var(--text-muted); letter-spacing: 0; }
.figure-note { font-size: 12.5px; color: var(--text-faint); margin-top: 8px; }

.delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0;
  background: var(--surface-2);
  color: var(--text-muted);
}
.delta.good { background: var(--accent); color: #fff; }
.delta.cool { background: var(--accent-soft); color: var(--accent); }
.delta.bad { background: var(--rose-soft); color: var(--rose); }

.tile { background: var(--surface-2); border-radius: var(--radius-md); padding: 13px 15px; }
.tile-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.13em; line-height: 1.3; }
.tile-val { font-weight: 600; font-size: 19px; margin-top: 6px; letter-spacing: -0.02em; }
button.tile { display: block; width: 100%; text-align: left; border: none; cursor: pointer; font-family: inherit; color: inherit; }
button.tile:hover { background: var(--surface-3); }

/* ---- Buttons & controls -------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: var(--radius-pill);
  border: none;
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  transition: transform .1s ease, background .16s ease;
  font-family: inherit;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink-2); }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--surface-3); }
.btn-danger { background: var(--rose-soft); color: var(--rose); }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.45; pointer-events: none; }
.card.feature .btn-primary { background: #fff; color: var(--ink); }
.card.feature .btn-secondary { background: rgba(255,255,255,0.12); border-color: transparent; color: var(--on-ink); }

.link-btn {
  background: none;
  border: none;
  color: var(--text);
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  padding: 0 0 2px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  border-bottom: 1px solid var(--accent);
}
.card.feature .link-btn { color: var(--on-ink); border-color: rgba(255,255,255,0.5); }

.pill-select {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0;
  text-transform: none;
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--surface-2); }
.band .icon-btn { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.22); color: #fff; }

/* ---- Forms --------------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 15px; }
.field label { font-size: 11.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
.field input, .field select, .field textarea {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 15px;
  font-family: inherit;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.field textarea { resize: vertical; min-height: 66px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; min-width: 0; }
.checkbox-row { display: flex; align-items: center; gap: 10px; }
.checkbox-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.slider { width: 100%; accent-color: var(--accent); }

/* ---- Rings, bars, bubbles, dot grids -------------------------------- */
.ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.ring-label { position: absolute; text-align: center; }
.ring-label .val { font-size: 26px; font-family: var(--font-display); display: block; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-label .cap { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; display: block; margin-top: 5px; }
.card.feature .ring-label .cap { color: var(--on-ink-muted); }

.bar { background: var(--surface-2); border-radius: var(--radius-pill); height: 8px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--accent); transition: width .5s cubic-bezier(.2,.7,.3,1); }
.bar.thin { height: 6px; }
.bar.thick { height: 12px; }
.card.feature .bar { background: rgba(255, 255, 255, 0.14); }

.bar-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; }
.bar-row + .bar-row { border-top: 1px solid var(--border-soft); }
.bar-row .br-val { font-weight: 600; font-size: 20px; letter-spacing: -0.02em; min-width: 56px; font-variant-numeric: tabular-nums; }
.bar-row .br-val small { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-left: 2px; }
.bar-row .br-track { flex: 1; min-width: 0; }
.bar-row .br-name { font-size: 11px; font-weight: 600; color: var(--text-muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.1em; }
.bar-row .br-name i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.bubbles { display: block; width: 100%; height: auto; }

.dotgrid { display: grid; gap: 5px; grid-template-columns: repeat(14, 1fr); }
.dotgrid i { display: block; aspect-ratio: 1; border-radius: 50%; background: var(--surface-3); }
.dotgrid i.l1 { background: var(--series-c); opacity: .55; }
.dotgrid i.l2 { background: var(--series-b); }
.dotgrid i.l3 { background: var(--series-a); }
.dotgrid i.miss { background: var(--rose-soft); }
.dotgrid i.today { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.dot-legend { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 16px; font-size: 11px; color: var(--text-muted); font-weight: 500; }
.dot-legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* ---- Week column chart ---------------------------------------------- */
.marked { display: flex; align-items: stretch; gap: 12px; }
.marked > i { width: 4px; border-radius: 3px; flex-shrink: 0; }
.marked .m-body { min-width: 0; }
.marked .m-label { font-size: 10.5px; font-weight: 600; color: var(--on-ink-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.1em; }

.wkbars { display: flex; align-items: stretch; gap: 7px; height: 130px; }
.wkcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
.wktrack { flex: 1; display: flex; align-items: flex-end; border-radius: 7px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.wkfill { width: 100%; border-radius: 7px; background: rgba(255, 255, 255, 0.35); min-height: 4px; }
.wkcol.is-today .wkfill { background: #fff; }
.wkcol.is-best .wkfill { background: var(--series-b); }
.wklabel { font-size: 9.5px; font-weight: 600; color: var(--on-ink-muted); text-align: center; text-transform: uppercase; letter-spacing: 0.06em; }
.wkcol.is-today .wklabel { color: #fff; }

/* ---- Rows, badges, chips -------------------------------------------- */
.stat-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 0; }
.stat-row + .stat-row { border-top: 1px solid var(--border-soft); }
.stat-row .label { font-size: 13px; color: var(--text-muted); }
.stat-row .value { font-size: 13.5px; font-weight: 600; }
.stat-row .value .of { color: var(--text-faint); font-weight: 400; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.badge-good { background: var(--ink); color: var(--on-ink); }
.badge-mid { background: var(--accent-soft); color: var(--accent); }
.badge-bad { background: var(--rose-soft); color: var(--rose); }
.badge-neutral { background: var(--surface-2); color: var(--text-muted); }
.card.feature .badge-neutral { background: rgba(255,255,255,0.14); color: var(--on-ink-muted); }
.card.feature .badge-good { background: #fff; color: var(--ink); }

.streak-row { display: flex; gap: 8px; flex-wrap: wrap; }
.streak-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface-2);
  border-radius: var(--radius-pill);
  padding: 8px 15px;
  font-size: 12px;
  font-weight: 600;
}
.streak-chip svg { color: var(--accent); }
.card.feature .streak-chip { background: rgba(255,255,255,0.12); color: var(--on-ink); }
.card.feature .streak-chip svg { color: #fff; }

/* ---- Meals ---------------------------------------------------------- */
.meal-card {
  display: flex;
  flex-direction: column;
  gap: 11px;
  padding: 17px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-soft);
  background: var(--surface);
}
.meal-card + .meal-card { margin-top: 10px; }
.meal-card.status-completed { border-color: var(--accent); background: var(--accent-soft); }
.meal-card.status-skipped { opacity: 0.6; }
.meal-card.status-modified { border-color: var(--series-b); }
.meal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.meal-head .meal-type { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--text-muted); }
.meal-head .meal-food { font-size: 20px; margin-top: 5px; font-family: var(--font-display); letter-spacing: -0.01em; line-height: 1.15; }
.meal-head .meal-qty { font-size: 12.5px; color: var(--text-muted); margin-top: 5px; }
.meal-macros { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); }
.meal-macros b { color: var(--text); font-weight: 600; }
.meal-note { font-size: 12px; color: var(--text-faint); font-style: italic; }
.meal-actions { display: flex; gap: 6px; margin-top: 2px; }
.meal-actions button {
  flex: 1;
  padding: 9px 6px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-family: inherit;
}
.meal-actions button.on.done { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.meal-actions button.on.skip { background: var(--rose-soft); color: var(--rose); border-color: transparent; }
.meal-actions button.on.mod { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.check-row { display: flex; align-items: center; gap: 14px; padding: 13px 2px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.check-row:last-child { border-bottom: none; }
.check-circle {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .16s ease, border-color .16s ease;
}
.check-circle.done { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.check-circle.skip { background: var(--rose-soft); border-color: var(--rose-soft); color: var(--rose); }
.check-row .name { flex: 1; font-weight: 600; font-size: 14px; min-width: 0; }
.check-row .name .sub { display: block; font-size: 12.5px; color: var(--text-faint); font-weight: 400; }
.check-row.done .name { color: var(--text-faint); }
.check-row.done .name .sub { text-decoration: line-through; }

/* ---- Workout -------------------------------------------------------- */
.exercise-card { border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 16px; margin-bottom: 10px; background: var(--surface); }
.exercise-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
.exercise-head-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.exercise-head .name { font-size: 18px; text-transform: capitalize; font-family: var(--font-display); letter-spacing: -0.01em; }

/* Two-pose stick-figure thumbnail, crossfading in place — a glanceable
   stand-in for a demo GIF that needs no image file and nothing external. */
.ex-thumb { flex: 0 0 auto; width: 34px; height: 43px; color: var(--accent); }
.ex-thumb svg { display: block; width: 100%; height: 100%; }
.ex-thumb .pg-a { animation: pgFrameA 2.2s ease-in-out infinite; }
.ex-thumb .pg-b { animation: pgFrameB 2.2s ease-in-out infinite; }
@keyframes pgFrameA { 0%, 42% { opacity: 1; } 50%, 92% { opacity: 0; } 100% { opacity: 1; } }
@keyframes pgFrameB { 0%, 42% { opacity: 0; } 50%, 92% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .ex-thumb .pg-a { opacity: 1 !important; }
  .ex-thumb .pg-b { opacity: 0 !important; }
}
.set-row { display: grid; grid-template-columns: 24px 1fr 1fr 36px; gap: 8px; align-items: center; margin-bottom: 7px; }
.set-row .set-idx { font-size: 11px; color: var(--text-faint); font-weight: 600; text-align: center; }
.set-row input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 14px; width: 100%; color: var(--text); text-align: center; font-family: inherit; }
.set-row .set-done { width: 32px; height: 32px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface-2); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-faint); }
.set-row .set-done.checked { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.set-row-labels { display: grid; grid-template-columns: 24px 1fr 1fr 36px; gap: 8px; margin-bottom: 6px; }
.set-row-labels span { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-faint); font-weight: 600; text-align: center; }
.set-add-remove { display: flex; gap: 8px; margin-top: 10px; }
.set-add-remove button { flex: 1; padding: 9px; border-radius: var(--radius-pill); border: 1px dashed var(--border); background: none; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }

/* ---- HIIT circuit --------------------------------------------------- */
.hiit-exercises { display: flex; flex-direction: column; gap: 10px; }
.hiit-ex-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); }
.hiit-ex-row:last-child { border-bottom: none; }
.hiit-ex-row .name { font-size: 14px; font-weight: 600; text-transform: capitalize; }
.card.feature .hiit-ex-row { border-color: rgba(255,255,255,0.12); }

/* ---- Calendar ------------------------------------------------------- */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow { text-align: center; font-size: 9px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.14em; padding-bottom: 8px; }
.cal-day {
  position: relative;
  aspect-ratio: 1;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid transparent;
  background: var(--surface-2);
  color: var(--text-muted);
}
.cal-day.empty { visibility: hidden; cursor: default; }
/* A flame badges any excellent day that's part of a 2+ day run — the chain
   of fire across the grid is the streak, no separate counter needed. */
.cal-flame { position: absolute; top: 2px; right: 3px; display: flex; color: var(--amber); }
.cal-day.excellent .cal-flame { color: #ffb238; } /* stays legible over the dark "excellent" fill */
.cal-day .dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 4px; }
.cal-day.excellent { background: var(--ink); color: var(--on-ink); }
.cal-day.excellent .dot { background: rgba(255,255,255,0.55); }
.cal-day.partial { background: var(--accent-soft); color: var(--accent); }
.cal-day.partial .dot { background: var(--accent); }
.cal-day.missed { background: var(--rose-soft); color: var(--rose); }
.cal-day.missed .dot { background: var(--rose); }
.cal-day.not_started { background: var(--surface-2); color: var(--text-faint); }
.cal-day.not_started .dot { background: var(--border); }
.cal-day.future { background: transparent; border-color: var(--border-soft); color: var(--text-faint); }
.cal-day.today { border-color: var(--accent); }
.cal-legend { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 16px; font-size: 11px; color: var(--text-muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend .dot { width: 9px; height: 9px; border-radius: 50%; }

/* ---- Journey -------------------------------------------------------- */
.week-strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; scroll-snap-type: x proximity; }
.week-strip::-webkit-scrollbar { display: none; }
.week-chip {
  flex-shrink: 0;
  scroll-snap-align: start;
  width: 92px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-soft);
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  background: var(--surface);
}
.week-chip.current { border-color: var(--ink); }
.week-chip .wk { font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-faint); font-weight: 600; }
.week-chip .pct { font-size: 26px; font-family: var(--font-display); margin: 7px 0; letter-spacing: -0.02em; }
.week-status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.week-card { border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: 20px; background: var(--surface); cursor: pointer; box-shadow: var(--shadow-sm); }
.week-card + .week-card { margin-top: 12px; }
.week-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
.week-card-head .title { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.01em; }

/* ---- Empty states, photos ------------------------------------------- */
.empty-state { text-align: center; padding: 40px 18px; color: var(--text-muted); }
.empty-state svg { color: var(--text-faint); margin-bottom: 12px; }
.empty-state .title { color: var(--text); margin-bottom: 6px; font-size: 21px; font-family: var(--font-display); }
.empty-state .desc { font-size: 13.5px; margin-bottom: 14px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.photo-slot {
  aspect-ratio: 3/4;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  cursor: pointer;
  overflow: hidden;
  font-size: 11px;
}
.photo-slot img { width: 100%; height: 100%; object-fit: cover; }

/* ---- Before/after slider --------------------------------------------- */
/* Two full-size photos stacked exactly on top of each other; the "before"
   one is cropped with clip-path rather than resized, so revealing more or
   less of it never stretches or squishes the image — only a native
   <input type="range"> drives it, so it works identically with a mouse, a
   finger, or a keyboard, no custom drag math needed. */
.compare-slider {
  position: relative;
  width: 100%;
  aspect-ratio: 3/4;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--surface-2);
  user-select: none;
}
.cs-after, .cs-before {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.cs-handle {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 0 1px rgba(4, 8, 26, 0.25);
  transform: translateX(-50%);
  pointer-events: none;
}
.cs-handle-grip {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 34px; height: 34px;
  border-radius: 50%;
  background: #fff;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  box-shadow: var(--shadow-md);
}
.cs-label {
  position: absolute;
  top: 10px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  background: rgba(4, 8, 26, 0.68);
  color: #fff;
  padding: 5px 10px;
  border-radius: var(--radius-pill);
  white-space: nowrap;
}
.cs-label-left { left: 10px; }
.cs-label-right { right: 10px; }

/* ---- FAB, sheets, toast --------------------------------------------- */
.fab {
  position: fixed;
  right: 16px;
  bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  z-index: 45;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--on-ink);
  border: none;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
@media (min-width: 900px) { .fab { display: none; } }
.fab:active { transform: scale(0.94); }

.sheet-overlay { position: fixed; inset: 0; background: rgba(4, 8, 26, 0.55); z-index: 60; display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(3px); }
@media (min-width: 700px) { .sheet-overlay { align-items: center; } }
.sheet {
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: var(--shadow-lg);
}
@media (min-width: 700px) { .sheet { border-radius: 26px; max-height: 82vh; } }
.sheet-handle { width: 38px; height: 4px; border-radius: 3px; background: var(--border); margin: 0 auto 14px; }
@media (min-width: 700px) { .sheet-handle { display: none; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.sheet-head h3 { font-size: 26px; }
.quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quick-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 16px 6px;
  border-radius: var(--radius-md);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text);
  font-family: inherit;
  text-align: center;
}
.quick-item:hover { background: var(--surface-3); }

function downscaleImage(file, maxEdge) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);

      img.src = reader.result;

    reader.readAsDataURL(file);
